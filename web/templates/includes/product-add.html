<div x-data="{ product_url: '', isSending: false }" class="max-w-6xl mx-auto my-8 xl:mt-12">
    <form @submit="isSending = true" class="relative flex" action="/products/add" method="GET">
        <input 
            x-model="product_url"
            name="product_url"
            type="text"
            placeholder="Cole aqui a url do produto..."
            class="w-full px-3 py-2 bg-surface-container-low border border-white/10 rounded-l-lg text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent sm:text-sm transition-colors"
        >
        <a
            @click="isSending= true"
            :href="'/products/add?product_url=' + encodeURIComponent(product_url)"
            class="inline-flex items-center px-3 py-2 primary-btn rounded-r-lg focus:outline-none"
            :class="{ 'w-24 pointer-events-none opacity-70': product_url === '' || isSending }"
            :disabled="product_url === '' || isSending"
        >
            <span x-show="!isSending">Adicionar</span>
            <svg 
                    x-cloak
                    x-show="isSending"
                    xmlns="http://www.w3.org/2000/svg" 
                    height="24px" 
                    viewBox="0 -960 960 960" 
                    width="24px" 
                    fill="currentColor"
                    class="w-full animate-spin"
                >
                    <path d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-155.5t86-127Q252-817 325-848.5T480-880q17 0 28.5 11.5T520-840q0 17-11.5 28.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-17 11.5-28.5T840-520q17 0 28.5 11.5T880-480q0 82-31.5 155t-86 127.5q-54.5 54.5-127 86T480-80Z"/>
                </svg>
        </a>
    </form>
</div>
