<!-- confirm-modal -->
<script>
document.addEventListener("alpine:init", () => {
    Alpine.store("confirmModal", {
        visible: false,
        text: null,
        confirmCallback: null,
        cancelCallback: null,

        set(text, confirmCallback, cancelCallback = null) {
            this.text = text;
            this.confirmCallback = confirmCallback;
            this.cancelCallback = cancelCallback;
            this.visible = true;
        },

        _close() {
            // cancel event bubbles
            if(this.cancelCallback) {
                this.cancelCallback();
            }

            this.visible = false;
            this.text = null;
            this.confirmCallback = null;
            this.cancelCallback = null;
            window.dispatchEvent(new CustomEvent("confirm-modal-close"));
        }
    });
});
</script>
<template x-data x-if="$store.confirmModal.visible">
    <div
        @click="$store.confirmModal._close()"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm"
    >
        <div
            class="relative w-full lg:max-w-xl p-6 bento-card"
        >
            <span class="material-symbols-outlined absolute top-3 right-3 text-on-surface-variant hover:text-on-surface lg:cursor-pointer">
                close
            </span>
            <p
                x-html="$store.confirmModal.text"
                class="text-lg text-on-surface mb-4"
            ></p>
            <div class="flex justify-end gap-2">
                <button
                    @click="$store.confirmModal.cancelCallback()"
                    class="text-on-surface-variant hover:text-on-surface hover:bg-white/5 border border-white/10 p-2 min-w-24 rounded-lg transition-colors lg:cursor-pointer"
                >
                    Cancelar
                </button>
                <button
                    @click="$store.confirmModal.confirmCallback()"
                    class="bg-danger text-white hover:brightness-110 p-2 min-w-24 rounded-lg transition lg:cursor-pointer"
                >
                    Sim
                </button>
            </div>
        </div>
    </div>
</template>
<!-- fim confirm-modal -->
