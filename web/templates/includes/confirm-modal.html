<!-- confirm-modal -->
<script>
document.addEventListener("alpine:init", () => {
    Alpine.store("confirmModal", {
        visible: false,
        text: null,
        confirmCallback: null,
        cancelCallback: null,

        set(text, confirmCallback, cancelCallback = null) {
            this.text = text;
            this.confirmCallback = confirmCallback;
            this.cancelCallback = cancelCallback;
            this.visible = true;
        },

        _close() {
            // cancel event bubbles
            if(this.cancelCallback) {
                this.cancelCallback();
            }

            this.visible = false;
            this.text = null;
            this.confirmCallback = null;
            this.cancelCallback = null;
            window.dispatchEvent(new CustomEvent("confirm-modal-close"));
        }
    });
});
</script>
<template x-data x-if="$store.confirmModal.visible">
    <div
        @click="$store.confirmModal._close()"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-500/20"
    >
        <div
            class="relative w-full lg:max-w-xl p-4 bg-white rounded-lg"
        >
            <span class="material-symbols-rounded absolute top-2 right-2 text-gray-400 hover:text-gray-500 lg:cursor-pointer">
                close
            </span>
            <p
                x-html="$store.confirmModal.text"
                class="text-lg text-gray-800 mb-4"
            ></p>
            <div class="flex justify-end gap-2 text-white">
                <button
                    @click="$store.confirmModal.cancelCallback()"
                    class="bg-blue-400 hover:bg-blue-500 p-2 min-w-24 rounded-md shadow-lg lg:cursor-pointer"
                >
                    Cancelar
                </button>
                <button
                    @click="$store.confirmModal.confirmCallback()"
                    class="bg-red-400 hover:bg-red-500 p-2 min-w-24 rounded-md shadow-lg lg:cursor-pointer"
                >
                    Sim
                </button>
            </div>
        </div>
    </div>
</template>
<!-- fim confirm-modal -->
