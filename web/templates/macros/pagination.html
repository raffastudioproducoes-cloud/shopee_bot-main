{% macro  pagination(view)-%}
<div class="flex justify-center gap-2 items-center mt-6">
    {% if cursor %}
    <a href="javascript:history.back()"
       class="primary-btn px-3 py-2 rounded-lg">
        Anterior
    </a>
    {% endif %}

    {% if next_cursor %}
    <a href="{{ url_for(view, limit=limit, cursor=next_cursor) }}"
       class="primary-btn px-3 py-2 rounded-lg">
        Próximo
    </a>
    {% endif %}
</div>
{%- endmacro %}
