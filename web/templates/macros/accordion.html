{#
    uses alpine data
    accordion object:
    - str title
#}
{% macro open_accordion() -%}
<!-- start accordion -->
<div x-data="{ open: false }">
    <div class="flex justify-between items-center text-left focus:outline-none">
        <span class="font-medium text-on-surface" x-text="accordion.title"></span>
        <span
            @click.stop="open = !open"
            :class="{ 'rotate-180': open }"
            class="material-symbols-outlined transform transition-transform !text-4xl text-on-surface-variant hover:text-on-surface cursor-pointer"
        >
            keyboard_arrow_down
        </span>
    </div>
    <div
        x-cloak
        x-show="open"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 max-h-0"
        x-transition:enter-end="opacity-100 max-h-screen"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 max-h-screen"
        x-transition:leave-end="opacity-0 max-h-0"

    >
{%- endmacro %}

{# ACCORDION CONTENT HERE #}

{% macro close_accordion() -%}
    </div>
</div>
<!-- end accordion -->
{%- endmacro %}
