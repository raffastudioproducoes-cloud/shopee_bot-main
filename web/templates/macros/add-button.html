{% macro add_button(href="#", material="add", class="") -%}
{% set base_class = "fixed bottom-5 left-5 w-16 h-16 rounded-lg bg-blue-400 hover:bg-blue-500 text-white transition-colors shadow-md flex justify-center items-center" %}
<a
    href="{{ href }}"
    class="{{ class }} {{ base_class }}"
>
    <span class="material-symbols-outlined !text-3xl">
        {{ material }}
    </span>
</a>
{%- endmacro %}
