{% macro add_button(href="#", material="add", class="") -%}
{% set base_class = "fixed bottom-5 md:left-[calc(16rem+1.25rem)] left-5 w-16 h-16 rounded-lg primary-btn shadow-[0_0_15px_rgba(255,77,45,0.15)] flex justify-center items-center" %}
<a
    href="{{ href }}"
    class="{{ class }} {{ base_class }}"
>
    <span class="material-symbols-outlined !text-3xl">
        {{ material }}
    </span>
</a>
{%- endmacro %}
