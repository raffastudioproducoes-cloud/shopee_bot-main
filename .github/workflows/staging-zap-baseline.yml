name: ZAP baseline passivo - staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: zap-staging-baseline
  cancel-in-progress: false

jobs:
  passive-zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Aguardar staging responder HTTP 200
        run: |
          for i in $(seq 1 24); do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://shopee-bot-staging.onrender.com/health || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: OWASP ZAP baseline sem ataques ativos
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://shopee-bot-staging.onrender.com/
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-staging-baseline
          cmd_options: "-m 1 -I"
