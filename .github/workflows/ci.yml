name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Python (lint + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar FFmpeg para os testes de video
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # alinhado ao Dockerfile (python:3.13-slim)
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install flake8 pytest

      - name: Flake8 (erros de sintaxe/nomes indefinidos — bloqueante)
        run: flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 (estilo — informativo)
        continue-on-error: true
        run: flake8 api/ --count --exclude=__init__.py --max-line-length=120 --statistics

      - name: Checar sintaxe Python
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/config.py
          python -m py_compile api/database.py

      - name: Testes da API
        # -m pytest garante o repo root no sys.path; --confcutdir isola do
        # conftest.py raiz (gevent monkey-patch trava anyio/httpx do FastAPI).
        run: python -m pytest tests/api --confcutdir=tests/api -q

      - name: Testes do scheduler de publicação
        run: python -m pytest tests/scheduler --confcutdir=tests/scheduler -q

      - name: Contratos de migracoes de seguranca e indices
        run: python -m pytest tests/database/test_056_harden_internal_grants.py tests/database/test_057_revoke_table_ddl_grants.py --confcutdir=tests/database -q

      - name: Testes de seguranca do proxy, CSP e bridge de agendamento
        run: python -m pytest tests/web/test_api_proxy_csrf.py tests/web/test_csp_policy.py tests/web/test_internal_func_whitelist.py --confcutdir=tests/web -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (tsc && vite build)
        run: npm run build
