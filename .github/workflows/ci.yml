name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f4e-postgres-proposal:
    name: F4E proposta (PostgreSQL descartável)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f4e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f4e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'psycopg[binary]==3.2.9'
      - name: Contratos estáticos e PostgreSQL isolado
        env:
          F4E_DISPOSABLE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/f4e_test
        run: |
          python -m unittest discover -s tests/sql -p 'test_f4e1_*.py' -v
          python -m unittest discover -s tests/sql -p 'test_f4e2b2_*.py' -v
          python -m unittest discover -s tests/sql -p 'test_f4e2b3_*.py' -v
          python -m unittest discover -s tests/sql -p 'test_f4e2b4_*.py' -v
          python -m unittest discover -s tests/sql -p 'test_f4e2b*.py' -v
          python -m unittest discover -s tests/sql -p 'test_platform_ai_*.py' -v
          python -m unittest discover -s tests/sql -p 'test_platform_shopee_*.py' -v

  api:
    name: API Python (lint + testes)
    # Fixado no 24.04: o ubuntu-latest virou 26.04 ("resolute"), cujo apt tenta variantes amd64v3
    # que o mirror não serve e perde ~20 s por pacote ao instalar o FFmpeg (código 124).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Disponibilizar FFmpeg para os testes de vídeo
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            # Ubuntu runner: o mirror Azure ocasionalmente encerra sem entregar os pacotes.
            # Preferir o mirror oficial e limitar cada tentativa sem remover testes de vídeo.
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
              # Runners novos listam os mirrors em um arquivo (mirror+file:); o sed acima não pega.
              sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/ubuntu.sources
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 update
            fi
            timeout 360s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 install -y --no-install-recommends ffmpeg
            ffmpeg -version
            ffprobe -version
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # alinhado ao Dockerfile (python:3.13-slim)
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install flake8 pytest

      - name: Flake8 (erros de sintaxe/nomes indefinidos — bloqueante)
        run: flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 (estilo — informativo)
        continue-on-error: true
        run: flake8 api/ --count --exclude=__init__.py --max-line-length=120 --statistics

      - name: Checar sintaxe Python
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/config.py
          python -m py_compile api/database.py

      - name: Testes da API
        # -m pytest garante o repo root no sys.path; --confcutdir isola do
        # conftest.py raiz (gevent monkey-patch trava anyio/httpx do FastAPI).
        run: python -m pytest tests/api --confcutdir=tests/api -q

      - name: Testes do scheduler de publicação
        run: python -m pytest tests/scheduler --confcutdir=tests/scheduler -q

      - name: Testes do gate SemVer
        run: python -m unittest discover -s tests/ci -p 'test_release_semver.py' -v

      - name: Testes do verificador de deploy (CD)
        run: python -m unittest discover -s tests/ci -p 'test_verify_deploy.py' -v

      - name: Contratos de migracoes de seguranca e indices
        run: python -m pytest tests/database/test_056_harden_internal_grants.py tests/database/test_057_revoke_table_ddl_grants.py tests/database/test_089_platform_ai_credentials.py tests/database/test_090_platform_shopee_affiliate_ids.py tests/database/test_093_account_billing_identity.py tests/database/test_096_performance_indexes.py --confcutdir=tests/database -q

      - name: Testes de proxy e seguranca, CSP e bridge de agendamento
        run: python -m pytest tests/web/test_api_proxy.py tests/web/test_api_proxy_csrf.py tests/web/test_csp_policy.py tests/web/test_internal_func_whitelist.py --confcutdir=tests/web -q

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Mantém os contratos de calendário/weekday e acesso ao plano no gate frontend.
      - name: Contratos de rotas, login e piloto visual da landing
        run: node --test tests/landing-entry-routing.test.mjs tests/landing-share-metadata.test.mjs tests/support-username-login.test.mjs tests/landing-orbital-pilot.test.mjs tests/presentation-page.test.mjs tests/motion-ux.test.mjs tests/undo-float-slide.test.mjs tests/brand-code-logo.test.mjs tests/pwa-brand.test.mjs tests/loadings.test.mjs tests/skeleton-guard.test.mjs tests/menu-groups.test.mjs tests/login-orbit-scene.test.mjs tests/plan-tags.test.mjs tests/count-ease-and-nav.test.mjs tests/posts-composer.test.mjs tests/form-drafts.test.mjs tests/campaign-snapshots.test.mjs tests/campaign-networks-checkboxes.test.mjs tests/campaign-schedule.test.mjs tests/plan-access.test.mjs tests/account-identity.test.mjs tests/profiles-identity-only.test.mjs tests/plan-checkout.test.mjs tests/admin-billing.test.mjs tests/plan-purchase-flow.test.mjs tests/signup-validation.test.mjs tests/user-timezone.test.mjs tests/dashboard-account.test.mjs

      - name: Ordenação de Listas e buscas contextuais (Node 20)
        run: node --test tests/posts-history-pagination.test.mjs tests/lists-sort.test.mjs tests/scoped-page-search.test.mjs tests/products-topbar-tab.test.mjs tests/products-topbar-search.test.mjs tests/product-media-upload-progress.test.mjs tests/campaign-product-media-selector.test.mjs

      - name: Credenciais — ordem, agrupamento e Shopee Vídeo (Node 20)
        run: node --test tests/credentials-card-order.test.mjs tests/credentials-sections.test.mjs tests/credentials-compact-platforms.test.mjs tests/platform-ai-panel.test.mjs tests/admin-diagnostics-compact.test.mjs tests/admin-diagnostics-catalog.test.mjs

      - name: Build (tsc && vite build)
        run: npm run build

  staging-external-security:
    name: Staging externo (HTTP + rate limit)
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testar staging implantado antes de promocao
        env:
          STAGING_SMOKE_USERNAME: ${{ secrets.STAGING_SMOKE_USERNAME }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: python scripts/staging_security_smoke.py
