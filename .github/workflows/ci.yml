name: CI — Lint e Test da API Python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install flake8 pytest

      - name: Lint
        run: |
          # Detectar problemas de syntaxe e estilo com flake8
          # Ignorar erros de importação não resolvida por falta de deps opcionais
          flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 api/ --count --exclude=__init__.py --max-line-length=120 --statistics || true

      - name: Check syntaxe Python
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/config.py
          python -m py_compile api/database.py
