# SBOM do artefato Docker reconstruído a partir do commit do repositório.
# Importante: o Render recompila sua própria imagem. Este SBOM cobre a imagem
# construída no GitHub pelo MESMO Dockerfile/commit, não prova identidade byte
# a byte com a instância em execução no Render.
name: SBOM - imagem Docker (CycloneDX)

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - Dockerfile
      - requirements.txt
      - api/requirements.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/sbom.yml
  schedule:
    - cron: '20 9 * * 1'

permissions:
  contents: write # somente SBOM em branch sbom-archive; não toca main/staging

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventário de dependências e SO
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagem do commit (sem publicar nem injetar secrets)
        run: |
          docker build --pull \
            --build-arg RENDER_GIT_COMMIT="$GITHUB_SHA" \
            --tag "auto-orbital-sbom:$GITHUB_SHA" .

      - name: Criar SBOM CycloneDX da imagem de teste
        uses: anchore/sbom-action@v0
        with:
          image: "auto-orbital-sbom:${{ github.sha }}"
          format: cyclonedx-json
          artifact-name: "auto-orbital-${{ github.ref_name }}-${{ github.sha }}.cdx.json"
          output-file: "./auto-orbital.cdx.json"
          upload-artifact: false
          upload-release-assets: false

      - name: Confirmar saída do inventário e identificador do commit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          doc = json.loads(Path("auto-orbital.cdx.json").read_text())
          assert doc["bomFormat"] == "CycloneDX"
          assert doc["components"], "SBOM sem componentes"
          print("SBOM válido:", len(doc["components"]), "componentes; commit", os.environ["GITHUB_SHA"])
          PY

      - name: Guardar SBOM na branch dedicada (sem disparar deploy)
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$SOURCE_BRANCH" in main|staging) ;; *) echo "Branch inesperada" >&2; exit 1 ;; esac
          cp auto-orbital.cdx.json /tmp/auto-orbital.cdx.json
          git fetch origin sbom-archive
          git switch -C sbom-archive origin/sbom-archive
          mkdir -p inventory
          cp /tmp/auto-orbital.cdx.json "inventory/${SOURCE_BRANCH}.cdx.json"
          printf 'source_sha=%s\nsource_branch=%s\nworkflow_run=%s\n' \
            "$SOURCE_SHA" "$SOURCE_BRANCH" "$GITHUB_RUN_ID" > "inventory/${SOURCE_BRANCH}.provenance.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "inventory/${SOURCE_BRANCH}.cdx.json" "inventory/${SOURCE_BRANCH}.provenance.txt"
          if ! git diff --cached --quiet; then
            git commit -m "sbom: ${SOURCE_BRANCH} ${SOURCE_SHA}"
            git push origin HEAD:sbom-archive
          fi
