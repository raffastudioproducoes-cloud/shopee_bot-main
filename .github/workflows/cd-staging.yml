name: CD Staging — Deploy no Render

# O deploy da staging é feito pelo autoDeploy do Render (serviço shopee-bot-staging, branch
# staging). Não há hook: um hook junto do autoDeploy implantaria duas vezes. Depois do deploy,
# staging-security-smoke.yml e staging-zap-baseline.yml exercitam o ambiente publicado.
on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Registrar que o deploy é do autoDeploy do Render
        run: |
          echo "::notice::Staging é implantada pelo autoDeploy do Render a cada push na branch staging (commit ${GITHUB_SHA::7}). Este workflow não dispara deploy; os smokes pós-deploy rodam nos workflows de staging."
