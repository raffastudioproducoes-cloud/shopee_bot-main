# docker-compose.yml — livemy.app (Opção B: Supabase externo)
#
# ATENÇÃO: NÃO há senhas neste arquivo. O livemy.app deve injetar as
# variáveis de ambiente em tempo de deploy (Settings do projeto ou MCP).
# Se o livemy não injetar, o app crasha ao conectar no banco.
#
# Variáveis obrigatórias (fornecidas pelo livemy, NÃO commitadas):
#   POSTGRES_HOST, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   POSTGRES_SSLMODE, APP_ENCRYPTION_KEY, FLASK_SESSION_SECRET,
#   FLASK_UPLOAD_FOLDER, FLASK_MAX_CONTENT_LENGTH, LOG_LEVEL,
#   THREADS_PERMISSIONS, THREADS_CALLBACK_URL
# Opcionais (vazias = inativo): CLOUDINARY_*, THREADS_APP_ID, THREADS_SECRET

services:
  app:
    container_name: shopee-bot-app
    image: shopee-bot-app
    environment:
      - PYTHONPATH=/
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_SSLMODE
      - APP_ENCRYPTION_KEY
      - FLASK_SESSION_SECRET
      - FLASK_UPLOAD_FOLDER=upload
      - FLASK_MAX_CONTENT_LENGTH=52428800
      - LOG_LEVEL=20
      - CLOUDINARY_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_SECRET
      - THREADS_APP_ID
      - THREADS_SECRET
      - THREADS_PERMISSIONS
      - THREADS_CALLBACK_URL
    volumes:
      - static:/shopee_bot/web/static/
      - user-data:/shopee_bot/web/media/
    networks:
      - shopee-network

  nginx:
    container_name: shopee-bot-server
    image: nginx:1.27-alpine
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 5s
    healthcheck:
      test: curl -f localhost/health || exit 1
      interval: 1m
    volumes:
      - static:/var/www/files/static/
      - user-data:/var/www/files/media/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shopee-network
    ports:
      - 80:80
    depends_on:
      - app

networks:
  shopee-network:
    name: shopee-network
    driver: bridge

volumes:
  static:
    name: shopee-bot-static
  user-data:
    name: shopee-bot-user-data
