services:
  app:
    container_name: shopee-bot-app
    image: shopee-bot-app
    environment:
      - PYTHONPATH=/
      - PYTHONUNBUFFERED=1
      # Banco externo (Supabase) — Opção B
      - POSTGRES_HOST=aws-0-us-east-1.pooler.supabase.com:5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=***
      - POSTGRES_DB=postgres
      - POSTGRES_SSLMODE=require
      - APP_ENCRYPTION_KEY=mYQcBId_eAoXUodGwci_ywhDVG9IIs2iml8aAsHvyqE=
      - FLASK_SESSION_SECRET=rafa-shopee-2026-prod-secret
      - FLASK_UPLOAD_FOLDER=upload
      - FLASK_MAX_CONTENT_LENGTH=52428800
      - LOG_LEVEL=20
      # Cloudinary (vazio = media inativo)
      - CLOUDINARY_NAME=
      - CLOUDINARY_API_KEY=
      - CLOUDINARY_SECRET=
      # Threads (vazio = publicação inativa)
      - THREADS_APP_ID=
      - THREADS_SECRET=
      - THREADS_PERMISSIONS=threads_basic,threads_content_publish,threads_keyword_search,threads_manage_mentions,threads_manage_replies
      - THREADS_CALLBACK_URL=https://vh-prod-shopee-bot-main-master-9c18c3-df590fa1.livemy.site/panel/credentials/threads/1
    volumes:
      - static:/shopee_bot/web/static/
      - user-data:/shopee_bot/web/media/
    networks:
      - shopee-network
    depends_on:
      - database

  database:
    container_name: shopee-bot-database
    image: postgres:17-alpine
    shm_size: 128mb
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
    command: ["postgres", "-c", "log_min_messages=DEBUG1", "-c", "log_statement=all"]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 5s
    healthcheck:
      test: pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - shopee-network

  nginx:
    container_name: shopee-bot-server
    image: nginx:1.27-alpine
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        window: 5s
    healthcheck:
      test: curl -f localhost/health || exit 1
      interval: 1m
    volumes:
      - static:/var/www/files/static/
      - user-data:/var/www/files/media/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./cert.pem:/etc/nginx/cert.pem:ro
      - ./key.pem:/etc/nginx/key.pem:ro
    networks:
      - shopee-network
    ports:
      - 2025:2025
    depends_on:
      - app

networks:
  shopee-network:
    name: shopee-network
    driver: bridge

volumes:
  static:
    name: shopee-bot-static
  user-data:
    name: shopee-bot-user-data
  database:
    name: shopee-bot-database
