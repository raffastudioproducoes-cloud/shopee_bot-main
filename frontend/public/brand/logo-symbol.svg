    <circle r="71" fill="#000"/>
    <path d="M 40 -58 A 71 71 0 0 1 70 12" fill="none" stroke="#ffb98a" stroke-width="3" opacity=".55" filter="url(#sy-blur3)"/>
  </g>
  <g transform="translate(200 206) rotate(-20)"><g class="ao-disk-glow"><ellipse rx="160" ry="52" fill="none" stroke="url(#sy-diskA)" stroke-width="1.2" opacity="0.55" clip-path="url(#sy-front)"/><ellipse rx="154" ry="49" fill="none" stroke="url(#sy-diskA)" stroke-width="1.8" opacity="0.8" clip-path="url(#sy-front)"/><ellipse rx="148" ry="46" fill="none" stroke="url(#sy-diskB)" stroke-width="1.4" opacity="0.7" clip-path="url(#sy-front)"/><ellipse rx="142" ry="44" fill="none" stroke="url(#sy-diskA)" stroke-width="2.6" opacity="0.95" clip-path="url(#sy-front)"/><ellipse rx="136" ry="41" fill="none" stroke="url(#sy-diskB)" stroke-width="1.6" opacity="0.85" clip-path="url(#sy-front)"/><ellipse rx="131" ry="39" fill="none" stroke="url(#sy-diskB)" stroke-width="3.2" opacity="1" clip-path="url(#sy-front)"/><ellipse rx="128" ry="38" fill="none" stroke="url(#sy-hot)" stroke-width="9" opacity=".65" filter="url(#sy-blur4)" clip-path="url(#sy-front)"/><ellipse rx="128" ry="38" fill="none" stroke="url(#sy-hot)" stroke-width="3.4" clip-path="url(#sy-front)"/><ellipse rx="128" ry="38" fill="none" stroke="url(#sy-hotline)" stroke-width="1.3" clip-path="url(#sy-front)"/></g></g>
  <g transform="translate(200 206) rotate(-20)"><circle cx="-160" cy="22" r="6" fill="#3b7bff" opacity=".5" filter="url(#sy-blur3)"/><circle cx="-160" cy="22" r="3.6" fill="url(#sy-sphere)"/></g>
  
