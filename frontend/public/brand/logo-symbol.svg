    <g><g><animateMotion dur="11s" repeatCount="indefinite" path="M -184 0 A 184 70 0 1 1 184 0 A 184 70 0 1 1 -184 0"/><circle r="7" fill="#3b7bff" opacity=".6" filter="url(#sy-blur3)"/><circle r="4.2" fill="url(#sy-sphere)"/></g></g>
  </g>
  <g transform="translate(200 206)">
