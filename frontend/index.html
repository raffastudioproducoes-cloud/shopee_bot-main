<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#010719" />
    <meta name="description" content="Auto Orbital: organize, agende e publique conteúdos para suas redes sociais em um só lugar." />
    <link rel="canonical" href="https://shopee-bot-fj0w.onrender.com/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Social bots read the initial server HTML, before React loads. All URLs must be public HTTPS. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Auto Orbital" />
    <meta property="og:url" content="https://shopee-bot-fj0w.onrender.com/" />
    <meta property="og:title" content="Auto Orbital | Gestão de postagens para redes sociais" />
    <meta property="og:description" content="Organize, agende e publique conteúdos para suas redes sociais em um só lugar. Conheça o Auto Orbital, da Raffa Studio Produções." />
    <meta property="og:image" content="https://shopee-bot-fj0w.onrender.com/brand/og-image.png" />
    <meta property="og:image:secure_url" content="https://shopee-bot-fj0w.onrender.com/brand/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Auto Orbital — identidade visual da plataforma de gerenciamento de postagens" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auto Orbital | Gestão de postagens para redes sociais" />
    <meta name="twitter:description" content="Organize, agende e publique conteúdos para suas redes sociais em um só lugar." />
    <meta name="twitter:image" content="https://shopee-bot-fj0w.onrender.com/brand/og-image.png" />
    <meta name="twitter:image:alt" content="Auto Orbital — plataforma de gerenciamento de postagens" />
    <link rel="stylesheet" href="/src/styles/tokens/colors.css" />
    <title>Auto Orbital | Gestão de postagens para redes sociais</title>
    <link rel="stylesheet" href="/splash.css" />
    <script defer src="/splash.js"></script>
  </head>
  <body>
    <div id="site-splash" role="status" aria-busy="true" aria-label="Carregando Auto Orbital">
      <div class="site-splash-content">
        <img class="site-splash-logo" src="/brand/symbol.png" alt="" width="96" height="96" />
        <div class="site-splash-name">Auto Orbital</div>
        <div class="site-splash-boot">
          <div class="site-splash-tagline">SEUS POSTS A UM CLIQUE</div>
          <div class="site-splash-version">Versão %APP_VERSION%</div>
          <div class="site-splash-credit">Raffa Studio Produções</div>
          <div class="site-splash-badge">Powered by Raffa Studio</div>
        </div>
        <div class="site-splash-error" role="alert">
          <p>Não foi possível abrir o Auto Orbital. Verifique sua conexão e tente novamente.</p>
          <button type="button" id="site-splash-reload">Recarregar</button>
        </div>
        <noscript><div class="site-splash-noscript">Ative o JavaScript para abrir o Auto Orbital.</div></noscript>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
